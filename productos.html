<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Elementos con alquimia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:wght@400;600&display=swap" rel="stylesheet">

    <style>
       
        :root {
            --bg: #fdfaf6;
            --sidebar: #2d2b1e;
            --sidebar-text: #f5f3ed;
            --topbar: #f5f3ed;
            --text: #2d2b1e;
            --text-soft: #5a4634;
            --card: #f5f3ed;
            --card-hover: #f3ead6;
            --card-border: #e6e1d5;
            --gold: #d8b26e;
            --green: #2a806a;
            --indigo: #2d2a7b;
            --radius: 14px;
            --shadow: 0 2px 8px rgba(45, 43, 30, .10);
        }

        /* ===== Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: var(--text);
            background-color: var(--bg);
            height: 100vh;
            overflow: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
        }

        :focus-visible {
            outline: 3px solid var(--indigo);
            outline-offset: 2px;
        }

        .icon {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== Layout ===== */
        .app-layout {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            padding: 40px 0;
            flex-shrink: 0;
            z-index: 20;
        }

        .sidebar h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 28px;
            font-weight: 400;
            padding: 0 40px;
            margin-bottom: 48px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            min-height: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--gold) transparent;
        }

        .nav-item {
            font-size: 18px;
            padding: 16px 40px;
            margin: 0 20px;
            border-radius: var(--radius);
            transition: background-color .2s ease, color .2s ease;
        }

        .nav-menu div.nav-item {
            font-size: 14px;
            opacity: .7;
            padding-bottom: 0;
        }

        .nav-menu a.nav-item:hover,
        .nav-sub a:hover {
            background-color: rgba(255, 255, 255, .12);
        }

        .nav-item.active,
        .nav-menu a.nav-item.active:hover {
            background-color: var(--gold);
            color: var(--text);
            font-weight: 500;
        }

        .nav-row {
            position: relative;
        }

        .nav-row .nav-item {
            display: block;
        }

        .nav-toggle {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-toggle svg {
            width: 18px;
            height: 18px;
            transition: transform .2s ease;
        }

        .nav-toggle[aria-expanded="false"] svg {
            transform: rotate(-90deg);
        }

        .nav-sub {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: -8px;
        }

        .nav-sub[hidden] {
            display: none;
        }

        .nav-sub a {
            display: block;
            font-size: 16px;
            padding: 8px 20px 8px 64px;
            margin: 0 20px;
            border-radius: var(--radius);
            opacity: .85;
            transition: background-color .2s ease;
        }

        .nav-empty {
            font-size: 14px;
            padding: 4px 20px 4px 64px;
            opacity: .6;
        }

        .scrim {
            display: none;
        }

        /* ===== Topbar ===== */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg);
            min-width: 0;
        }

        .topbar {
            height: 80px;
            background-color: var(--topbar);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            flex-shrink: 0;
            box-shadow: 0 1px 0 var(--card-border);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            display: none;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: transparent;
            align-items: center;
            justify-content: center;
        }

        .menu-btn svg {
            width: 24px;
            height: 24px;
        }

        .brand-logo {
            height: 52px;
            width: auto;
            display: block;
            mix-blend-mode: multiply; 
        }

        .topbar-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .search-bar {
            background-color: var(--bg);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 5px 20px;
            width: 350px;
            height: 40px;
            transition: box-shadow .2s ease;
        }

        .search-bar:focus-within {
            box-shadow: 0 0 0 3px var(--indigo);
        }

        .search-bar input {
            border: none;
            outline: none;
            background: transparent;
            flex-grow: 1;
            min-width: 0;
        }

        .search-icon {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-soft);
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .user-profile {
            width: 40px;
            height: 40px;
            background-color: var(--indigo);
            color: #fdfaf6;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            flex-shrink: 0;
        }

        /* ===== Contenido ===== */
        .content {
            padding: 40px;
            overflow-y: auto;
            flex-grow: 1;
            scrollbar-width: thin;
            scrollbar-color: var(--gold) transparent;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 8px;
        }

        .section-title {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 28px;
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .round-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background-color: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color .2s ease, border-color .2s ease;
        }

        .round-btn svg {
            width: 22px;
            height: 22px;
        }

        .round-btn:hover,
        .round-btn.active {
            background-color: var(--gold);
            border-color: var(--gold);
        }

        .hint {
            color: var(--text-soft);
            min-height: 24px;
            margin-bottom: 32px;
        }

        /* ===== Cards de productos ===== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr));
            gap: 32px;
            max-width: 1000px;
        }

        .product-card {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 20px;
            background-color: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
            transition: box-shadow .2s ease, background-color .2s ease, border-color .2s ease;
        }

        /* Hover tipo "selección": aro dorado y fondo tenue */
        .product-card:hover {
            background-color: var(--card-hover);
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold);
        }

        .product-img {
            position: relative;
            aspect-ratio: 1 / 1;
            width: 100%;
            border-radius: 10px;
            background-color: var(--card-border);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img svg {
            width: 56px;
            height: 56px;
            stroke-width: 1.2;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .product-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 500;
            overflow-wrap: anywhere;
        }

        .edit-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: transparent;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color .2s ease;
        }

        .edit-btn svg {
            width: 20px;
            height: 20px;
        }

        .edit-btn:hover {
            background-color: var(--gold);
        }

        .product-price {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 20px;
            font-weight: 600;
        }

        .product-stock {
            color: var(--text-soft);
            margin-top: 8px;
        }

        .product-stock.low {
            font-weight: 500;
            color: var(--text);
        }

        .product-stock.low::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 8px;
            border-radius: 50%;
            background-color: var(--gold);
        }

        .btn-insumos {
            margin-top: auto;
            align-self: flex-end;
            padding: 6px 20px;
            border-radius: 30px;
            background-color: rgba(42, 128, 106, .14);
            color: var(--green);
            font-size: 15px;
            font-weight: 500;
            transition: background-color .2s ease, color .2s ease;
        }

        .btn-insumos:hover {
            background-color: var(--green);
            color: #fdfaf6;
        }

        /* ===== Modo baja ===== */
        .baja-mode .product-card:not(.is-baja) {
            border-style: dashed;
            border-color: var(--text-soft);
        }

        .baja-mode .product-card {
            cursor: pointer;
        }

        .is-baja {
            opacity: .6;
            background-color: #cdc7b6;
            border-color: #b8b19c;
        }

        .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 2px 12px;
            border-radius: 30px;
            background-color: var(--sidebar);
            color: var(--sidebar-text);
            font-size: 13px;
            font-weight: 500;
        }

        /* ===== Card "Nuevo producto" ===== */
        .new-card {
            min-height: 212px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--gold);
            border-radius: var(--radius);
            background-color: transparent;
            transition: box-shadow .2s ease, background-color .2s ease;
        }

        .new-card:hover {
            background-color: var(--card-hover);
            box-shadow: 0 0 0 3px var(--gold);
        }

        .new-circle {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background-color: rgba(216, 178, 110, .25);
            color: var(--text-soft);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .new-circle svg {
            width: 30px;
            height: 30px;
        }

        .baja-mode .new-card {
            opacity: .35;
            pointer-events: none;
        }

        .empty {
            grid-column: 1 / -1;
            color: var(--text-soft);
        }

        /* ===== Ventanas y avisos ===== */
        dialog {
            margin: auto;
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 32px;
            width: min(440px, 90vw);
            background-color: var(--bg);
            color: var(--text);
            box-shadow: 0 8px 32px rgba(45, 43, 30, .25);
        }

        dialog::backdrop {
            background-color: rgba(45, 43, 30, .5);
        }

        dialog h3 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 16px;
        }

        .dlg-text {
            color: var(--text-soft);
        }

        dialog label {
            display: block;
            color: var(--text-soft);
            margin: 16px 0 8px;
        }

        dialog input {
            width: 100%;
            height: 44px;
            padding: 0 16px;
            background-color: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            height: 44px;
            padding: 0 24px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
            background-color: var(--card);
            font-weight: 500;
        }

        .btn-primary {
            background-color: var(--green);
            border-color: var(--green);
            color: #fdfaf6;
        }

        .btn:hover {
            filter: brightness(.95);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translate(-50%, 24px);
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 12px 20px;
            border-radius: var(--radius);
            background-color: var(--sidebar);
            color: var(--sidebar-text);
            box-shadow: 0 8px 24px rgba(45, 43, 30, .3);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            z-index: 50;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
            pointer-events: auto;
        }

        .toast-btn {
            border: none;
            background: none;
            color: var(--gold);
            font-weight: 500;
        }

        .toast-btn:hover {
            text-decoration: underline;
        }

        /* ===== Movil o tablet ===== */
        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                transform: translateX(-100%);
                transition: transform .25s ease;
            }

            .menu-open .sidebar {
                transform: none;
            }

            .menu-open .scrim {
                display: block;
                position: fixed;
                inset: 0;
                background-color: rgba(45, 43, 30, .5);
                z-index: 10;
            }

            .menu-btn {
                display: flex;
            }

            .topbar,
            .content {
                padding-left: 20px;
                padding-right: 20px;
            }

            .brand-logo {
                height: 40px;
            }

            .search-bar {
                width: 180px;
            }
        }

        @media (max-width: 560px) {
            .search-bar {
                display: none;
            }

            .product-card {
                grid-template-columns: 120px 1fr;
                gap: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar">
            <h1>Usuario</h1>

            <nav class="nav-menu">
                <div class="nav-item">Menú</div>
                <a href="index.html" class="nav-item">Dashboard</a>
                <div class="nav-row">
                    <a href="inventarios.html" class="nav-item">Inventarios</a>
                    <button class="nav-toggle" id="nav-toggle" aria-expanded="true" aria-label="Mostrar u ocultar inventarios">
                        <svg class="icon" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                </div>

                <ul class="nav-sub" id="nav-inventarios"></ul>
                <a href="productos.html" class="nav-item active" aria-current="page">Productos</a>
                <a href="insumos.html" class="nav-item">Insumos</a>
            </nav>
        </aside>
        <div class="scrim" id="scrim"></div>

        <div class="main-wrapper">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-btn" id="menu-btn" aria-label="Abrir menú">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                    </button>
                    <a href="index.html">
                        <img class="brand-logo" src="logo.png" alt="Elementos con alquimia">
                    </a>
                </div>
                <div class="topbar-controls">
                    <div class="search-bar">
                        <input type="text" id="buscar" aria-label="Buscar producto" placeholder="Buscar producto">
                        <span class="search-icon"></span>
                    </div>
                    <div class="user-profile">U</div>
                </div>
            </header>

            <main class="content">
                <div class="page-header">
                    <h2 class="section-title">Productos</h2>
                    <div class="header-actions">
                        <button class="round-btn" id="btn-agregar" aria-label="Agregar producto" title="Agregar producto">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                        </button>
                        <button class="round-btn" id="btn-baja" aria-label="Dar de baja productos" aria-pressed="false" title="Dar de baja productos">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
                        </button>
                    </div>
                </div>
                <p class="hint" id="hint"></p>

                <div class="products-grid" id="grid"></div>
            </main>
        </div>
    </div>

    <dialog id="dlg">
        <form method="dialog" id="form-producto">
            <h3 id="dlg-titulo">Nuevo producto</h3>
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" maxlength="40" required autocomplete="off">
            <div class="field-row">
                <div>
                    <label for="precio">Precio (MXN)</label>
                    <input id="precio" type="number" min="0" step="0.01" required>
                </div>
                <div>
                    <label for="stock">Stock</label>
                    <input id="stock" type="number" min="0" step="1" required>
                </div>
            </div>
            <div class="dialog-actions">
                <button type="button" class="btn" id="cancelar">Cancelar</button>
                <button type="submit" class="btn btn-primary" id="dlg-guardar">Crear producto</button>
            </div>
        </form>
    </dialog>

    <script>
        // ===== Datos compartidos (antes shared.js) =====
        // Todo se guarda en localStorage, reemplazar por la bd
        // "baja: true" = dado de baja (no se elimina, se puede restablecer).
        const KEY_INV = 'eca_inventarios_v1';   // misma clave que usan index.html e inventarios.html
        const KEY_PROD = 'eca_productos_v1';

        const SEED_INV = [
            { id: 1, nombre: 'Inventario 1', descripcion: 'Materias primas y esencias para elaboración.', productos: 24, baja: false },
            { id: 2, nombre: 'Inventario 2', descripcion: 'Productos terminados listos para venta.', productos: 18, baja: false },
            { id: 3, nombre: 'Inventario 3', descripcion: 'Envases, etiquetas y material de empaque.', productos: 31, baja: false }
        ];
        const SEED_PROD = [
            { id: 1, nombre: 'Producto 1', precio: 150, stock: 10, baja: false },
            { id: 2, nombre: 'Producto 2', precio: 150, stock: 10, baja: false },
            { id: 3, nombre: 'Producto 3', precio: 150, stock: 10, baja: false }
        ];

        function cargar(key, seed) {
            try {
                const s = localStorage.getItem(key);
                if (s) return JSON.parse(s);
            } catch (e) {}
            return JSON.parse(JSON.stringify(seed));
        }

        const inventarios = cargar(KEY_INV, SEED_INV);   // solo lectura aquí (para el menú lateral)
        let productos = cargar(KEY_PROD, SEED_PROD);

        function guardar() {
            try { localStorage.setItem(KEY_PROD, JSON.stringify(productos)); } catch (e) {}
        }

        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // ===== Sidebar: inventarios activos =====
        function renderSidebar() {
            const ul = document.getElementById('nav-inventarios');
            const activos = inventarios.filter(i => !i.baja);
            ul.innerHTML = activos.length
                ? activos.map(i => `<li><a href="inventario.html?id=${i.id}">${esc(i.nombre)}</a></li>`).join('')
                : '<li class="nav-empty">Sin inventarios activos</li>';
        }

        // ===== Aviso con "Deshacer" =====
        function toast(msg, onUndo) {
            let t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.className = 'toast';
                t.setAttribute('role', 'status');
                document.body.appendChild(t);
            }
            t.innerHTML = '<span></span><button class="toast-btn">Deshacer</button>';
            t.firstChild.textContent = msg;
            t.querySelector('button').onclick = () => { onUndo(); t.classList.remove('show'); };
            t.classList.add('show');
            clearTimeout(t._t);
            t._t = setTimeout(() => t.classList.remove('show'), 6000);
        }

        // ===== Ventana de confirmación =====
        function confirmar(titulo, texto, okLabel, onOk) {
            let d = document.getElementById('dlg-confirm');
            if (!d) {
                d = document.createElement('dialog');
                d.id = 'dlg-confirm';
                d.innerHTML = '<h3></h3><p class="dlg-text"></p><div class="dialog-actions"><button class="btn" data-no>Cancelar</button><button class="btn btn-primary" data-ok></button></div>';
                document.body.appendChild(d);
                d.querySelector('[data-no]').onclick = () => d.close();
            }
            d.querySelector('h3').textContent = titulo;
            d.querySelector('.dlg-text').textContent = texto;
            const ok = d.querySelector('[data-ok]');
            ok.textContent = okLabel;
            ok.onclick = () => { d.close(); onOk(); };
            d.showModal();
        }

        // ===== Menú: submenú plegable y menú móvil =====
        document.getElementById('nav-toggle').addEventListener('click', e => {
            const ul = document.getElementById('nav-inventarios');
            ul.hidden = !ul.hidden;
            e.currentTarget.setAttribute('aria-expanded', !ul.hidden);
        });

        const alternarMenu = () => document.body.classList.toggle('menu-open');
        document.getElementById('menu-btn').addEventListener('click', alternarMenu);
        document.getElementById('scrim').addEventListener('click', alternarMenu);

        renderSidebar();
    </script>

    <script>
        // ===== Pantalla de productos =====
        const STOCK_BAJO = 5;       // a partir de este número se marca "(bajo)"
        let modoBaja = false;
        let filtro = '';
        let editandoId = null;      // null = creando un producto nuevo

        const grid = document.getElementById('grid');
        const hint = document.getElementById('hint');
        const btnBaja = document.getElementById('btn-baja');
        const dlg = document.getElementById('dlg');

        const iconoProducto = '<svg class="icon" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 10a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 19l-5-10V3"/><path d="M7.5 15h9"/></svg>';
        const iconoEditar = '<svg class="icon" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg>';

        const tarjetaNueva = `
            <button class="new-card" id="card-nuevo" aria-label="Nuevo producto">
                <div class="new-circle"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
            </button>`;

        const formatoPrecio = p => '$' + Number(p).toLocaleString('es-MX', {
            minimumFractionDigits: p % 1 === 0 ? 0 : 2,
            maximumFractionDigits: 2
        }) + ' MXN';

        function cardHTML(p) {
            const bajo = p.stock <= STOCK_BAJO;
            return `
                <div class="product-card${p.baja ? ' is-baja' : ''}" data-id="${p.id}">
                    <div class="product-img">
                        ${p.baja ? '<span class="badge">De baja</span>' : ''}
                        ${iconoProducto}
                    </div>
                    <div class="product-info">
                        <div class="product-top">
                            <span class="product-name">${esc(p.nombre)}</span>
                            <button class="edit-btn" aria-label="Editar ${esc(p.nombre)}" title="Editar">${iconoEditar}</button>
                        </div>
                        <span class="product-price">${formatoPrecio(p.precio)}</span>
                        <span class="product-stock${bajo ? ' low' : ''}">Stock: ${p.stock}${bajo ? ' (bajo)' : ''}</span>
                        <a class="btn-insumos" href="insumos.html?producto=${p.id}">Insumos</a>
                    </div>
                </div>`;
        }

        function render() {
            grid.classList.toggle('baja-mode', modoBaja);
            btnBaja.classList.toggle('active', modoBaja);
            btnBaja.setAttribute('aria-pressed', modoBaja);
            hint.textContent = modoBaja
                ? 'Modo baja: toca un producto para darlo de baja. Si ya está de baja, tócalo para restablecerlo.'
                : '';

            const q = filtro.toLowerCase();
            let lista = productos.filter(p => p.nombre.toLowerCase().includes(q));
            lista.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es', { numeric: true }));
            lista = [...lista.filter(p => !p.baja), ...lista.filter(p => p.baja)]; // los de baja al final

            let vacio = '';
            if (!lista.length) {
                vacio = filtro
                    ? `<p class="empty">Ningún producto coincide con "${esc(filtro)}".</p>`
                    : '<p class="empty">Aún no tienes productos. Crea el primero.</p>';
            }
            grid.innerHTML = vacio + lista.map(cardHTML).join('') + tarjetaNueva;
        }

        function actualizar() {
            guardar();
            render();
        }

        // Sin producto = crear uno nuevo; con producto = editarlo
        function abrirDialogo(p) {
            editandoId = p ? p.id : null;
            document.getElementById('form-producto').reset();
            document.getElementById('dlg-titulo').textContent = p ? 'Editar producto' : 'Nuevo producto';
            document.getElementById('dlg-guardar').textContent = p ? 'Guardar cambios' : 'Crear producto';
            if (p) {
                document.getElementById('nombre').value = p.nombre;
                document.getElementById('precio').value = p.precio;
                document.getElementById('stock').value = p.stock;
            }
            dlg.showModal();
            document.getElementById('nombre').focus();
        }

        function darDeBaja(p) {
            p.baja = true;
            actualizar();
            toast('"' + p.nombre + '" se dio de baja.', () => { p.baja = false; actualizar(); });
        }

        function restablecer(p) {
            confirmar(
                '¿Restablecer este producto?',
                '"' + p.nombre + '" volverá a estar activo.',
                'Restablecer',
                () => { p.baja = false; actualizar(); }
            );
        }

        grid.addEventListener('click', e => {
            if (e.target.closest('#card-nuevo')) return abrirDialogo();

            const card = e.target.closest('.product-card');
            if (!card) return;
            const p = productos.find(x => x.id === Number(card.dataset.id));

            // En modo baja (o si ya está de baja) toda la card responde y los enlaces no navegan
            if (p.baja || modoBaja) {
                e.preventDefault();
                return p.baja ? restablecer(p) : darDeBaja(p);
            }
            if (e.target.closest('.edit-btn')) abrirDialogo(p);
        });

        document.getElementById('btn-agregar').addEventListener('click', () => abrirDialogo());
        btnBaja.addEventListener('click', () => { modoBaja = !modoBaja; render(); });
        document.getElementById('cancelar').addEventListener('click', () => dlg.close());
        document.getElementById('buscar').addEventListener('input', e => { filtro = e.target.value.trim(); render(); });

        document.getElementById('form-producto').addEventListener('submit', () => {
            const datos = {
                nombre: document.getElementById('nombre').value.trim(),
                precio: parseFloat(document.getElementById('precio').value),
                stock: parseInt(document.getElementById('stock').value, 10)
            };
            if (!datos.nombre) return;

            if (editandoId !== null) {
                Object.assign(productos.find(x => x.id === editandoId), datos);
            } else {
                const id = Math.max(0, ...productos.map(x => x.id)) + 1;
                productos.push({ id, ...datos, baja: false });
            }
            actualizar();
        });

        render();
    </script>

</body>
</html>
