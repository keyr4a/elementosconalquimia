<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Elementos con alquimia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">

    <style>
        /* ===== Estilos propios de esta pantalla (el resto está en shared.css) ===== */

        button {
            cursor: pointer;
        }

        .greeting {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 32px;
            font-weight: 400;
            line-height: 1.2;
        }

        .greeting-sub {
            color: var(--text-soft);
            margin: 4px 0 40px;
        }

        .section-title {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 24px;
        }

        /* ===== Alertas de stock bajo ===== */
        .alerts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 32px;
            margin-bottom: 48px;
        }

        .alert-card {
            background-color: var(--card);
            border-bottom: 4px solid var(--gold);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            min-height: 90px;
            width: 100%;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .alert-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            color: var(--gold);
        }

        .alert-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .alert-info small {
            color: var(--text-soft);
        }

        .alert-action {
            color: var(--green);
            font-weight: 500;
            font-size: 15px;
        }

        .alert-action:hover {
            text-decoration: underline;
        }

        .stock-bar {
            height: 6px;
            border-radius: 6px;
            background-color: var(--card-border);
            overflow: hidden;
        }

        .stock-bar span {
            display: block;
            height: 100%;
            border-radius: 6px;
            background-color: var(--green);
        }

        .stock-bar span.warn {
            background-color: var(--gold);
        }

        .inventory-item {
            display: flex;
            flex-direction: column;
            gap: 16px;
            outline: none;
        }

        /* Hover tipo seleccion*/
        .inventory-item:hover .inventory-card {
            background-color: var(--card-hover);
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold);
            color: #d8b26e;
        }

        .empty {
            grid-column: 1 / -1;
            color: var(--text-soft);
        }

        /* ===== Movil o tablet ===== */
        @media (max-width: 900px) {
            .alerts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <main class="content">
        <h2 class="greeting" id="saludo">Buenas tardes, Usuario!</h2>
        <p class="greeting-sub">Esto es lo que necesita tu atención hoy.</p>

        <h2 class="section-title">Alertas de stock bajo</h2>
        <div class="alerts-grid">
            <div class="alert-card">
                <svg class="alert-icon icon" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4M12 17v.01"/></svg>
                <div class="alert-info">
                    <span>Producto A</span>
                    <div class="stock-bar"><span class="warn" style="width: 15%"></span></div>
                    <small>Quedan 3 de 20</small>
                </div>
                <a href="productos.html" class="alert-action">Reabastecer</a>
            </div>
            <div class="alert-card">
                <svg class="alert-icon icon" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4M12 17v.01"/></svg>
                <div class="alert-info">
                    <span>Producto B</span>
                    <div class="stock-bar"><span class="warn" style="width: 25%"></span></div>
                    <small>Quedan 5 de 20</small>
                </div>
                <a href="productos.html" class="alert-action">Reabastecer</a>
            </div>
        </div>

        <h2 class="section-title">Inventarios</h2>
        <div class="inventories-grid" id="grid"></div>
    </main>

    <script src="shared.js"></script>
    <script>
        montarLayout({ activo: 'dashboard' });

        // Saludo según la hora del día
        const h = new Date().getHours();
        const saludo = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
        document.getElementById('saludo').textContent = saludo + ', Usuario!';

        // Solo se muestran los inventarios activos (los dados de baja no aparecen aquí)
        const activos = inventarios.filter(i => !i.baja);
        document.getElementById('grid').innerHTML = activos.length
            ? activos.map(i => cardHTML(i, 'a')).join('')
            : '<p class="empty">Aún no tienes inventarios activos. <a href="inventarios.html" class="link">Ir a Inventarios</a></p>';
    </script>

</body>
</html>
